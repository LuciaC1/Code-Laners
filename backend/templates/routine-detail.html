{{define "routine-detail"}}
<div class="container my-5">
    <div class="row mb-3">
        <div class="col-12">
            <a href="/routines" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Volver a Rutinas
            </a>
        </div>
    </div>

    <div id="loadingSpinner" class="text-center">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <div id="routineContent" class="d-none">
        <div class="row">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="card-title" id="routineName"></h1>
                        <p class="text-muted" id="routineDescription"></p>
                        <div class="mb-3" id="routineBadges"></div>

                        <h4 class="mt-4 mb-3">Ejercicios de la Rutina</h4>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Orden</th>
                                        <th>Ejercicio</th>
                                        <th>Series</th>
                                        <th>Repeticiones</th>
                                        <th>Peso (kg)</th>
                                    </tr>
                                </thead>
                                <tbody id="exercisesTableBody"></tbody>
                            </table>
                        </div>

                        <div class="mt-4">
                            <button class="btn btn-primary" onclick="startWorkout()" id="startWorkoutBtn">
                                <i class="bi bi-play-circle"></i> Iniciar Entrenamiento
                            </button>
                            <button class="btn btn-outline-secondary" onclick="editRoutine()">
                                <i class="bi bi-pencil"></i> Editar
                            </button>
                            <button class="btn btn-outline-danger" onclick="deleteRoutine()">
                                <i class="bi bi-trash"></i> Eliminar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Resumen de la Rutina</h5>
                        <ul class="list-unstyled" id="routineSummary"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="errorMessage" class="alert alert-danger d-none"></div>
</div>
{{end}}
