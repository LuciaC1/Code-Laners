{{define "workouts"}}
<div class="container my-5">
    <div class="row mb-4">
        <div class="col-md-8">
            <h1><i class="bi bi-calendar-check"></i> Entrenamientos</h1>
            <p class="text-muted">Registra y realiza seguimiento de tus sesiones de entrenamiento</p>
        </div>
        <div class="col-md-4 text-end">
            <button class="btn btn-outline-primary" onclick="loadWorkouts()">
                <i class="bi bi-arrow-clockwise"></i> Actualizar
            </button>
            <a href="/workouts/create" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Nuevo Entrenamiento
            </a>
        </div>
    </div>
    <div class="row g-4" id="workoutsContainer">
        <div class="col-12 text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>
    </div>
</div>
{{end}}
