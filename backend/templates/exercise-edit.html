{{define "exercise-edit"}}
<div class="container my-5">
    <div class="row mb-3">
        <div class="col-12">
            <a href="/exercises" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Volver a Ejercicios
            </a>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h3 class="mb-0"><i class="bi bi-pencil-square"></i> Editar Ejercicio</h3>
                </div>
                <div class="card-body">
                    <div id="loadingSpinner" class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                    </div>

                    <form id="exerciseForm" class="d-none">
                        <div class="mb-3">
                            <label for="name" class="form-label">Nombre del Ejercicio *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Descripción</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="category" class="form-label">Categoría *</label>
                                <select class="form-select" id="category" name="category" required>
                                    <option value="">Seleccionar...</option>
                                    <option value="strength">Fuerza</option>
                                    <option value="cardio">Cardio</option>
                                    <option value="flexibility">Flexibilidad</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="muscle_group" class="form-label">Grupo Muscular *</label>
                                <select class="form-select" id="muscle_group" name="muscle_group" required>
                                    <option value="">Seleccionar...</option>
                                    <option value="chest">Pecho</option>
                                    <option value="back">Espalda</option>
                                    <option value="legs">Piernas</option>
                                    <option value="arms">Brazos</option>
                                    <option value="shoulders">Hombros</option>
                                    <option value="core">Core</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="difficulty" class="form-label">Dificultad *</label>
                                <select class="form-select" id="difficulty" name="difficulty" required>
                                    <option value="">Seleccionar...</option>
                                    <option value="beginner">Principiante</option>
                                    <option value="intermediate">Intermedio</option>
                                    <option value="advanced">Avanzado</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="media_url" class="form-label">URL de Imagen/Video</label>
                            <input type="url" class="form-control" id="media_url" name="media_url">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Pasos (Instrucciones)</label>
                            <div id="stepsContainer">
                                <!-- Steps will be loaded here -->
                            </div>
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="addStep()">
                                <i class="bi bi-plus"></i> Agregar Paso
                            </button>
                        </div>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button type="button" class="btn btn-secondary" onclick="window.location.href='/exercises'">
                                Cancelar
                            </button>
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-check-circle"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                    <div id="errorMessage" class="alert alert-danger d-none mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
