{{define "register"}}
<div class="main-content-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus text-theme" style="font-size: 3rem;"></i>
                            <h2 class="mt-3">Registrarse</h2>
                        </div>
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="name" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="mb-3">
                                <label for="role" class="form-label">Rol</label>
                                <select class="form-select" id="role" name="role" required>
                                    <option value="user">Usuario</option>
                                    <option value="admin">Administrador</option>
                                </select>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-warning btn-lg">
                                    <i class="bi bi-person-plus"></i> Registrarse
                                </button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <p>¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a></p>
                        </div>
                        <div id="errorMessage" class="alert alert-danger d-none mt-3"></div>
                        <div id="successMessage" class="alert alert-success d-none mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
