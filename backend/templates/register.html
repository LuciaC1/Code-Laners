{{define "register"}}
<div class="main-content-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus text-theme" style="font-size: 3rem;"></i>
                            <h2 class="mt-3">Registrarse</h2>
                            <p class="text-muted">Crea tu cuenta para comenzar tu viaje fitness</p>
                        </div>
                        <form id="registerForm">
                            <!-- Información Personal -->
                            <h5 class="mb-3 mt-4"><i class="bi bi-person"></i> Información Personal</h5>
                            <div class="mb-3">
                                <label for="name" class="form-label">Nombre completo <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="name" name="name" required minlength="2" maxlength="100">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="password" name="password" required minlength="6">
                                <small class="form-text text-muted">Mínimo 6 caracteres</small>
                            </div>
                            <div class="mb-3">
                                <label for="date_of_birth" class="form-label">Fecha de Nacimiento <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" required>
                            </div>

                            <!-- Datos Físicos -->
                            <h5 class="mb-3 mt-4"><i class="bi bi-activity"></i> Datos Físicos</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="weight" class="form-label">Peso (kg)</label>
                                    <input type="number" class="form-control" id="weight" name="weight" min="0" step="0.1">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="height" class="form-label">Altura (cm)</label>
                                    <input type="number" class="form-control" id="height" name="height" min="0" step="0.1">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="level" class="form-label">Nivel de Experiencia</label>
                                <select class="form-select" id="level" name="level">
                                    <option value="">Selecciona tu nivel</option>
                                    <option value="principiante">Principiante</option>
                                    <option value="intermedio">Intermedio</option>
                                    <option value="avanzado">Avanzado</option>
                                </select>
                            </div>

                            <!-- Objetivos de Fitness -->
                            <h5 class="mb-3 mt-4"><i class="bi bi-bullseye"></i> Objetivos de Fitness</h5>
                            <div class="mb-3">
                                <label class="form-label">Selecciona tus objetivos (puedes elegir varios)</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="goal-lose-weight" name="goals" value="perder peso">
                                    <label class="form-check-label" for="goal-lose-weight">
                                        Perder peso
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="goal-gain-muscle" name="goals" value="ganar músculo">
                                    <label class="form-check-label" for="goal-gain-muscle">
                                        Ganar músculo
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="goal-maintain" name="goals" value="mantenerse">
                                    <label class="form-check-label" for="goal-maintain">
                                        Mantenerse
                                    </label>
                                </div>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-warning btn-lg">
                                    <i class="bi bi-person-plus"></i> Registrarse
                                </button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <p>¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a></p>
                        </div>
                        <div id="errorMessage" class="alert alert-danger d-none mt-3"></div>
                        <div id="successMessage" class="alert alert-success d-none mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
