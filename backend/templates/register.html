{{template "layout" .}}

{{define "title"}}Registro - Ejemplo Web{{end}}

{{define "register-content"}}
<div class="main-content-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <!-- Columna ligeramente más ancha para incluir más campos -->
                <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5">
                    <div class="card shadow-lg">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <!-- Icono de persona agregando (Registro) -->
                                <i class="bi bi-person-add text-theme" style="font-size: 3rem;"></i>
                                <h2 class="mt-3 mb-1 fw-bold">Únete a GymPulse</h2>
                                <p class="text-muted">Crea tu cuenta para empezar tu entrenamiento</p>
                            </div>
                            
                            <!-- Área de mensajes -->
                            <div id="message" class="mb-4 d-none">
                                <!-- Los mensajes se insertarán aquí por JavaScript -->
                            </div>
                            
                            <!-- Formulario de Registro -->
                            <form id="registerForm">
                                
                                <!-- Nombre Completo -->
                                <div class="mb-3">
                                    <label for="fullName" class="form-label">Nombre Completo</label>
                                    <input type="text" class="form-control" id="fullName" name="fullName" required placeholder="Tu nombre">
                                </div>

                                <!-- Correo Electrónico -->
                                <div class="mb-3">
                                    <label for="email" class="form-label">Correo Electrónico</label>
                                    <input type="email" class="form-control" id="email" name="email" required placeholder="tu.correo@gympulse.com">
                                </div>
                                
                                <!-- Contraseña -->
                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="password" name="password" required placeholder="Mínimo 6 caracteres">
                                </div>

                                <!-- Confirmar Contraseña -->
                                <div class="mb-4">
                                    <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required placeholder="Repite tu contraseña">
                                </div>
                                
                                <div class="d-grid gap-2">
                                    <!-- Botón principal con estilo 'warning' -->
                                    <button type="submit" class="btn btn-warning btn-lg text-dark fw-bold" id="submitBtn">
                                        <i class="bi bi-person-check-fill me-2"></i>Crear Cuenta
                                    </button>
                                </div>
                            </form>
                            
                            <!-- Sección de inicio de sesión -->
                            <div class="text-center mt-4">
                                <p class="text-muted mb-0">¿Ya tienes una cuenta?</p>
                                <a href="/login" class="text-theme text-decoration-none fw-bold">Inicia Sesión aquí</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{{end}}

{{define "scripts-register"}}
<!-- Custom JS -->
<script src="/static/js/register.js"></script>
{{end}}
