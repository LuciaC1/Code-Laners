{{define "routine-create"}}
<div class="container my-5">
    <div class="row mb-3">
        <div class="col-12">
            <a href="/routines" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Volver a Rutinas
            </a>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0"><i class="bi bi-plus-circle"></i> Crear Nueva Rutina</h3>
                </div>
                <div class="card-body">
                    <form id="routineForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">Nombre de la Rutina *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Descripción</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="is_public" name="is_public">
                                <label class="form-check-label" for="is_public">
                                    Hacer esta rutina pública
                                </label>
                            </div>
                        </div>

                        <h5 class="mt-4 mb-3">Ejercicios de la Rutina</h5>
                        <div id="exercisesContainer">
                            <!-- Exercises will be loaded here -->
                        </div>
                        <button type="button" class="btn btn-outline-primary btn-sm mb-3" onclick="loadExerciseSelector()">
                            <i class="bi bi-plus"></i> Agregar Ejercicio
                        </button>

                        <div id="routineExercises">
                            <!-- Selected exercises will appear here -->
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <button type="button" class="btn btn-secondary" onclick="window.location.href='/routines'">
                                Cancelar
                            </button>
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle"></i> Crear Rutina
                            </button>
                        </div>
                    </form>
                    <div id="errorMessage" class="alert alert-danger d-none mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Exercise Selector Modal -->
    <div class="modal fade" id="exerciseSelectorModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Seleccionar Ejercicio</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="availableExercises" class="list-group">
                        <!-- Exercises will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
