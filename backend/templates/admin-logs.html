{{define "admin-logs"}}
<div class="container my-5">
    <div class="row mb-4">
        <div class="col-md-8">
            <h1><i class="bi bi-journal-text"></i> Logs del Sistema</h1>
            <p class="text-muted">Registro de actividades importantes del sistema</p>
        </div>
        <div class="col-md-4 text-end">
            <button class="btn btn-outline-primary" onclick="loadLogs()">
                <i class="bi bi-arrow-clockwise"></i> Actualizar
            </button>
            <button class="btn btn-outline-danger" onclick="clearLogs()">
                <i class="bi bi-trash"></i> Limpiar Logs
            </button>
        </div>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Fecha/Hora</th>
                            <th>Nivel</th>
                            <th>Tipo</th>
                            <th>Acción</th>
                            <th>Usuario</th>
                            <th>Detalles</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <tr>
                            <td colspan="6" class="text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Cargando...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{{end}}
