{{define "admin-logs"}}
<div class="container my-5">
    <div class="row mb-4">
        <div class="col-md-8">
            <h1><i class="bi bi-journal-text"></i> Logs del Sistema</h1>
            <p class="text-muted">Registro de actividades importantes del sistema</p>
        </div>
        <div class="col-md-4 text-end">
            <button class="btn btn-outline-primary" onclick="loadLogs()">
                <i class="bi bi-arrow-clockwise"></i> Actualizar
            </button>
            <button class="btn btn-outline-danger" onclick="clearLogs()">
                <i class="bi bi-trash"></i> Limpiar Logs
            </button>
        </div>
    </div>

    <!-- Filters -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="filterLogLevel" class="form-label">Nivel</label>
                    <select class="form-select" id="filterLogLevel">
                        <option value="">Todos</option>
                        <option value="info">Info</option>
                        <option value="warning">Advertencia</option>
                        <option value="error">Error</option>
                        <option value="success">Éxito</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="filterLogType" class="form-label">Tipo</label>
                    <select class="form-select" id="filterLogType">
                        <option value="">Todos</option>
                        <option value="user">Usuario</option>
                        <option value="exercise">Ejercicio</option>
                        <option value="routine">Rutina</option>
                        <option value="workout">Entrenamiento</option>
                        <option value="auth">Autenticación</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="filterLogDate" class="form-label">Fecha desde</label>
                    <input type="date" class="form-control" id="filterLogDate">
                </div>
                <div class="col-md-3">
                    <label class="form-label">&nbsp;</label>
                    <div>
                        <button class="btn btn-primary w-100" onclick="applyLogFilters()">
                            <i class="bi bi-funnel"></i> Filtrar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Logs Table -->
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Fecha/Hora</th>
                            <th>Nivel</th>
                            <th>Tipo</th>
                            <th>Acción</th>
                            <th>Usuario</th>
                            <th>Detalles</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <tr>
                            <td colspan="6" class="text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Cargando...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{{end}}
